# FM: a modulator's oscillator, scaled by the note's frequency, then its index, a modulator,
# wired into a carrier's frequency.
# Its frequency the note's, its tune its ratio to the note in semitones.
# Its scale the voice card's frequency wired in, so its index is the note's frequencies' share
# as FM's index is; its index a knob.
# An envelope wired into its index moves it in the index's units.
kind: FM
form: modulator
outputs: [{ name: out, channels: 1 }]
children:
  - { name: osc, kind: oscillator }
  - { name: scale, kind: gain }
  - { name: index, kind: gain }
wires:
  - { from: { node: osc, output: out }, to: { node: scale, input: in } }
  - { from: { node: scale, output: out }, to: { node: index, input: in } }
  - { from: { node: index, output: out }, to: { output: out } }
macros:
  - name: frequency
    hint: >-
      Its frequency, in hertz: the note's, which the voice card sets.
    maps: [{ to: [osc, frequency], factor: 1, offset: 0 }]
  - name: tune
    hint: >-
      Its ratio to the note, in semitones: 12 twice the note, 19.02 three times.
    spec: { unit: semitones, range: [-48, 48, 0.01], default: 0 }
    maps: [{ to: [osc, detune], factor: 100, offset: 0 }]
  - name: scale
    hint: >-
      What its index is a share of: the note's frequency wired in, as FM's index is.
    spec: { range: [0, 20000, 0.01], default: 1 }
    maps: [{ to: [scale, gain], factor: 1, offset: 0 }]
  - name: index
    hint: >-
      How far it moves its carrier's frequency, a share of the note's: brighter as it rises.
    spec: { range: [0, 20, 0.001], default: 0 }
    maps: [{ to: [index, gain], factor: 1, offset: 0 }]
  - name: stop
    hint: >-
      When it stops, in seconds from the note's start; at 0 it plays until its voice is let go.
    maps: [{ to: [osc, stop], factor: 1, offset: 0 }]
