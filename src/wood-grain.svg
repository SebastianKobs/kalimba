<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" preserveAspectRatio="none">
  <!-- wood grain: noise stretched along the board (slow across x, fast down y), its high streaks as dark fibres -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.12" numOctaves="4" seed="37" />
    <!-- the fibres' ink a deep rust brown; alpha from the noise's red channel, only its peaks -->
    <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.08  0 0 0 0 0.03  1.95 0 0 0 -0.79" />
  </filter>
  <rect width="900" height="420" filter="url(#grain)" />
</svg>
